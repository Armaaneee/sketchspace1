<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SketchSpace</title>
    <link rel="stylesheet" href-"styles.css"
  </head>
  <body>
    <div id="sidebar">
        <div id="sidebar-header">
            <div id="logo">
                <svg viewBox="0 0 24 24" width="36" height="36">
                    <path
                        fill="#4d90fe"
                        d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"
                    />
                </svg>
            </div>
        </div>

        <div class="tools-section">
            <div class="section-title">Tools</div>
                <button class="tool-button active" id="pen-button">
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"
                        />
                    </svg>
                </button>

            <button class="tool-button" id="eraser-button">
                <svg viewBox="0 0 24 24">
                    <path d="M15.14 3c-.51 0-1.02.2-1.41.59L2.59 14.73c-.78.77-.78 2.04 0 2.83L5.03 20h7.66l8.72-8.72c.78-.78.78-2.05 0-2.83l-4.85-4.86c-.39-.39-.9-.59-1.42-.59M7.5 18c-.83 0-1.5-.67-1.5-1.5S6.67 15 7.5 15s1.5.67 1.5 1.5S8.33 18 7.5 18m8.99-10.38L13.12 11l-3.5-3.5 2.38-2.38 4.5 4.5"/>
                </svg>
            </button>

            <div class="color-picker-wrapper">
                <input type="color" id="color-picker" value="#000000"/>
            </div>

            <div class="thickness-container">
                <div class="thickness-preview">
                    <div class="thickness-dot" id="thickness-dot"></div>
                </div>

                <div class="thickness-popup">
                    <div class="popup-title">Pen Thickness</div>
                    <input type="range" id="thickness-slider" class="thickness-slider" min="1" max="20" value="5"/>
                    <div class="thickness-value" id="thickness-value">5 px</div>
                </div>
            </div>

            <div class="eraser-thickness-container">
                <div class="eraser-thickness-preview">
                    <div class="eraser-thickness-dot" id="eraser-thickness-dot"></div>
                </div>
                <div class="eraser-thickness-popup">
                    <div class="popup-title">Eraser Thickness</div>
                    <input type="range" id="eraser-thickness-slider" class="thickness-slider" min="5" max="50" value="20"/>
                    <div class="thickness-value" id="eraser-thickness-value">20px</div>
                </div>
            </div>
        </div>

        <div class="tools-section">
            <div class="section-title">Actions</div>

            <button class="tool-button" id="clear-button">
                <svg viewBox="0 0 24 24">
                    <path d="M19 4h-3.5l-1-1h-5l-1 1H5v2h14M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12z"/>
                </svg>
            </button>
        </div>

        <div class="tools-section">
            <div class="section-title">Help</div>

            <button class="tool-button" id="info-button">
                <svg viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
                </svg>
            </button>
        </div>
    </div>

    <canvas id="whiteboard"></canvas>

    <div id="info-modal" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <h2>SketchSpace</h2>
            <p>A broswer based collaborative whiteboard tool</p>
            <p><strong>Keyboard Shortcuts:</strong></p>
            <ul>
                <li><strong>P</strong> - Pen Tool</li>
                <li><strong>E</strong> - Eraser Tool</li>
                <li><strong>C</strong> - Clear Whiteboard</li>
            </ul>
        </div>
    </div>


    <script src="script.js"></script>
  </body>
</html>
